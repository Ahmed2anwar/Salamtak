<section class="" style="margin-top: 140px; direction: rtl">
  <div class="container">
    <div class="row">
      <div class="content">
        <div class="text-center">
          <h2
            class="heading-title fw-semibold text-center pb-3"
            style="
              position: relative;
              color: #070625;
              font-family: Cairo, Sans-serif;
              font-size: 48px;
          "
         >
            {{ blog?.Title || blog?.Title }}
          </h2>
          <img
            class="rounded-3 mt-4 mb-5 img-fluid"
            src="https://salamtechapi.azurewebsites.net/{{
              blog?.image || blog?.Image
            }}"
            style="object-fit: cover"
          />
        </div>
        <h5 class="fw-medium" style="line-height: 34px">
          {{ blog?.Description || blog?.Description }}
        </h5>
      </div>
    </div>
  </div>
  <section class="posts mt-4" *ngIf="!loading">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="content mb-3" *ngFor="let section of blog.Sections">
            <img
              *ngIf="section.ImageUrl"
              class="mb-5 mt-3 rounded-2 img-fluid"
              [src]="section.ImageUrl"
              alt="section image"
            />
            <h2 class="fw-bold pb-3">
              {{ section.SubTitle }}
            </h2>
            <h5 class="mt-3 fw-medium " style="line-height: 34px">
              {{ section.Paragraph }}
            </h5>
          </div>
        </div>
      </div>
    </div>
  </section>
</section>
